# This workflow is version-independent. Never hard-code build numbers here.
# To publish any newer version, commit its signed APK payload, manifest.json,
# then update ready.json LAST. The manifest carries build code and APK digest.
name: Publish verified Android APK release
on:
  push:
    branches: [main]
    paths:
      - 'release-input/ready.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-signed-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout public binary-only release repository
        uses: actions/checkout@v4

      - name: Ensure APK signing/manifest validation tools
        shell: bash
        run: |
          set -euo pipefail
          # GitHub ubuntu-latest already includes Android SDK command-line tools.
          # Avoid setup-android action: on this runner it invokes the obsolete
          # sdkmanager "tools" package and fails before validation starts.
          SDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "build-tools;35.0.0"
          echo "$SDK_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Verify exact signed APK and publish matching release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish_apk.py
